<template>
    <div class="wiring">
        <header class="bar">
            <div class="bar__title">
                <h1>Agent wiring</h1>
                <p class="bar__sub">Choose which skills each subagent loads. An agent can have one wiring per subagent, plus an optional agent-level wiring that any other subagent falls back to. Agents read this at runtime through Agent_Skill_State.</p>
            </div>
            <lightning-button variant="brand" label="Wire an agent" icon-name="utility:add" onclick={handleNew}></lightning-button>
        </header>

        <template lwc:if={error}>
            <div class="notice notice--error" role="alert">
                <lightning-icon icon-name="utility:error" size="x-small" variant="error"></lightning-icon>
                <span>{error}</span>
            </div>
        </template>

        <div class="layout">
            <nav class="agents" aria-label="Wired agents">
                <template lwc:if={hasBindings}>
                    <template for:each={agentGroups} for:item="g">
                        <section key={g.agentName} class="group">
                            <h2 class="group__title">{g.agentName}</h2>
                            <ul>
                                <template for:each={g.rows} for:item="b">
                                    <li key={b.id}>
                                        <button type="button" class={b.cssClass} data-id={b.id} onclick={handleSelect}>
                                            <span class="agent__name">{b.subagentLabel}</span>
                                            <span class="agent__dev">{b.name}</span>
                                            <span class="agent__meta">
                                                {b.alwaysCount} always · {b.selectableCount} selectable
                                                <template lwc:if={b.isInactive}><span class="badge badge--warn">Inactive</span></template>
                                            </span>
                                        </button>
                                    </li>
                                </template>
                            </ul>
                            <lightning-button variant="base" label="Add subagent wiring" icon-name="utility:add" data-agent={g.agentName} onclick={handleAddSubagent}></lightning-button>
                        </section>
                    </template>
                </template>
                <template lwc:else>
                    <p class="empty">No agents wired yet.</p>
                </template>
            </nav>

            <section class="editor">
                <template lwc:if={loadingDetail}>
                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                </template>
                <template lwc:if={draft}>
                    <div class="card">
                        <h2>Agent</h2>
                        <div class="grid">
                            <lightning-input label="Agent developer name" required value={draft.agentName} data-field="agentName" onchange={handleField} field-level-help="config.developer_name from the .agent file. The agent passes it as agent_name."></lightning-input>
                            <template lwc:if={hasOrgAgents}>
                                <lightning-combobox label="Or pick an agent in this org" placeholder="Select an agent" options={agentOptions} onchange={handlePickAgent}></lightning-combobox>
                            </template>
                            <lightning-input label="Subagent" value={draft.subagent} data-field="subagent" onchange={handleField} placeholder="Blank for all subagents" field-level-help="Name of the subagent block in the .agent file that loads these skills. The subagent passes it as subagentName. Leave blank for an agent-level wiring that any subagent without its own wiring uses."></lightning-input>
                            <template lwc:if={hasSubagentChoices}>
                                <lightning-combobox label="Or pick a published subagent" placeholder="Select a subagent" options={subagentChoices} onchange={handlePickSubagent}></lightning-combobox>
                            </template>
                            <lightning-input label="Display name" value={draft.name} data-field="name" onchange={handleField}></lightning-input>
                            <lightning-combobox label="Status" options={statusOptions} value={draft.status} data-field="status" onchange={handleField}></lightning-combobox>
                            <lightning-input label="Locale" value={draft.locale} data-field="locale" onchange={handleField}></lightning-input>
                        </div>
                        <lightning-textarea label="Description" value={draft.description} data-field="description" onchange={handleField}></lightning-textarea>
                    </div>

                    <div class="card">
                        <h2>Runtime rules</h2>
                        <lightning-input type="checkbox" label="Load only approved skill versions" checked={draft.requireApproval} onchange={handleApproval} field-level-help="When on, the agent skips any skill version whose approval state is not Approved."></lightning-input>
                        <lightning-textarea label="Agent tools" value={draft.agentTools} data-field="agentTools" onchange={handleField} placeholder="create_case,get_order_status" field-level-help="CSV of the action names declared in the agent's script. Skills can only reference these tools, and each tool is enabled only while a skill that uses it is active."></lightning-textarea>
                    </div>

                    <div class="card">
                        <h2>Skills</h2>
                        <p class="hint">Always skills load on every turn. Selectable skills appear in the agent's skill menu. Default skills are active when the agent has not asked for anything else. Workflows load through the References of the skills that use them.</p>
                        <lightning-dual-listbox
                            label="Wired skills"
                            source-label="Available"
                            selected-label="Wired to this agent"
                            options={skillOptions}
                            value={wiredNames}
                            onchange={handleSkillsChange}></lightning-dual-listbox>

                        <template lwc:if={hasItems}>
                            <ol class="items">
                                <template for:each={itemRows} for:item="i">
                                    <li key={i.key} class="item">
                                        <span class="item__pos">{i.position}</span>
                                        <span class="item__main">
                                            <span class="item__name">{i.skillName} <span class={i.badgeClass}>{i.badge}</span></span>
                                            <span class="item__desc">{i.whenToUse}</span>
                                        </span>
                                        <lightning-combobox class="item__mode" variant="label-hidden" label="Mode" options={i.modeOptions} value={i.mode} data-index={i.index} onchange={handleMode}></lightning-combobox>
                                        <lightning-button-icon icon-name="utility:arrowup" variant="bare" alternative-text="Move up" data-index={i.index} data-step="-1" disabled={i.isFirst} onclick={handleMove}></lightning-button-icon>
                                        <lightning-button-icon icon-name="utility:arrowdown" variant="bare" alternative-text="Move down" data-index={i.index} data-step="1" disabled={i.isLast} onclick={handleMove}></lightning-button-icon>
                                        <lightning-button-icon icon-name="utility:close" variant="bare" alternative-text="Remove" data-index={i.index} onclick={handleRemove}></lightning-button-icon>
                                    </li>
                                </template>
                            </ol>
                        </template>
                    </div>

                    <div class="actions">
                        <template lwc:if={draft.id}>
                            <lightning-button variant="destructive-text" label="Delete" onclick={handleDelete}></lightning-button>
                        </template>
                        <lightning-button label="Agent Script snippet" icon-name="utility:copy" onclick={handleSnippet}></lightning-button>
                        <lightning-button variant="brand" label="Save" disabled={saveDisabled} onclick={handleSave}></lightning-button>
                    </div>

                    <template lwc:if={snippet}>
                        <div class="card">
                            <div class="card__head">
                                <h2>Agent Script snippet</h2>
                                <lightning-button label="Copy" icon-name="utility:copy" onclick={handleCopy}></lightning-button>
                            </div>
                            <p class="hint">Paste into the agent's .agent file and declare each tool's definition under load_skill_state. The gated tool lines at the end come from Agent tools. No skill names go in the script.</p>
                            <pre class="code">{snippet}</pre>
                        </div>
                    </template>

                    <template lwc:if={draft.agentName}>
                        <c-skill-state-preview
                            agent-name={draft.agentName}
                            subagent={draft.subagent}
                            subagents={wiredSubagents}
                            disabled-reason={previewDisabledReason}
                            onsubagentchange={handlePreviewSubagent}></c-skill-state-preview>
                    </template>
                </template>
                <template lwc:elseif={hasBindings}>
                    <p class="empty">Select a subagent wiring to edit its skills.</p>
                </template>
            </section>
        </div>
    </div>
</template>

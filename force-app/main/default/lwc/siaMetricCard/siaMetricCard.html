<template>
    <div class="metric-card slds-box slds-theme_default slds-p-around_medium">
        <div class="slds-text-title slds-m-bottom_xx-small">{label}</div>
        <div class="metric-value slds-text-heading_large">{formattedValue}</div>
        <template lwc:if={hasDelta}>
            <span class={deltaClass}>{delta}</span>
        </template>
        <template lwc:if={subtitle}>
            <div class="slds-text-body_small slds-text-color_weak">{subtitle}</div>
        </template>
    </div>
</template>

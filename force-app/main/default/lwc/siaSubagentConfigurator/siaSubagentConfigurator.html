<template>
    <lightning-card title="Subagent Configuration" icon-name="custom:custom58">
        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Loading subagent configs" size="medium"></lightning-spinner>
        </template>
        <template lwc:else>
            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <template lwc:if={hasNoAgent}>
                    <p class="slds-text-body_regular slds-text-color_weak">Select an agent to view subagent configurations.</p>
                </template>
                <template lwc:else>
                    <lightning-accordion allow-multiple-sections-open active-section-name={activeSections}>
                        <template for:each={configs} for:item="config">
                            <lightning-accordion-section key={config.Id} name={config.Id} label={config.topic_area__c}>
                                <div class="section-content">
                                    <!-- Optimal Actions - narrow field -->
                                    <div class="optimal-actions-container">
                                        <lightning-input
                                            type="number"
                                            label="Optimal Actions"
                                            value={config.optimal_actions__c}
                                            data-id={config.Id}
                                            data-field="optimal_actions__c"
                                            onchange={handleFieldChange}
                                        ></lightning-input>
                                    </div>

                                    <h4 class="slds-text-heading_small slds-m-top_medium slds-m-bottom_x-small">Outcome Mapping</h4>
                                    <template for:each={config.parsedOutcomeMapping} for:item="mapping">
                                        <div key={mapping.key} class="mapping-row slds-m-bottom_x-small">
                                            <div class="mapping-event">
                                                <lightning-input
                                                    label="Domain Event"
                                                    value={mapping.event}
                                                    data-id={config.Id}
                                                    data-mapping-key={mapping.key}
                                                    data-mapping-field="event"
                                                    onchange={handleMappingChange}
                                                ></lightning-input>
                                            </div>
                                            <div class="mapping-outcome">
                                                <lightning-combobox
                                                    label="Maps To"
                                                    value={mapping.outcome}
                                                    options={outcomeOptions}
                                                    data-id={config.Id}
                                                    data-mapping-key={mapping.key}
                                                    data-mapping-field="outcome"
                                                    onchange={handleMappingChange}
                                                ></lightning-combobox>
                                            </div>
                                            <div class="mapping-delete-col">
                                                <lightning-button-icon
                                                    icon-name="utility:delete"
                                                    alternative-text="Remove mapping"
                                                    variant="bare"
                                                    data-id={config.Id}
                                                    data-mapping-key={mapping.key}
                                                    onclick={handleRemoveMapping}
                                                ></lightning-button-icon>
                                            </div>
                                        </div>
                                    </template>
                                    <lightning-button
                                        label="Add Mapping"
                                        icon-name="utility:add"
                                        variant="neutral"
                                        data-id={config.Id}
                                        onclick={handleAddMapping}
                                        class="slds-m-top_x-small"
                                    ></lightning-button>

                                    <h4 class="slds-text-heading_small slds-m-top_medium slds-m-bottom_x-small">Significant Outcome Triggers</h4>
                                    <div class="triggers-horizontal">
                                        <lightning-checkbox-group
                                            options={config.triggerOptions}
                                            value={config.selectedTriggers}
                                            data-id={config.Id}
                                            onchange={handleTriggerChange}
                                        ></lightning-checkbox-group>
                                    </div>

                                    <div class="slds-m-top_medium slds-text-align_right">
                                        <lightning-button
                                            label="Save"
                                            variant="brand"
                                            data-id={config.Id}
                                            onclick={handleSave}
                                        ></lightning-button>
                                    </div>
                                </div>
                            </lightning-accordion-section>
                        </template>
                    </lightning-accordion>
                </template>
            </div>
        </template>
    </lightning-card>
</template>
